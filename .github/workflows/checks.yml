name: Checks

# Runs lint, the type check, the unit tests and the production build on each
# push to main.
on:
  push:
    branches: [main]
  # PR runs are off: agents run `mise run check` locally before they merge.
  # To run this on PRs again, uncomment the line below.
  # pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Windows runs steps in PowerShell unless told otherwise.
defaults:
  run:
    shell: bash

jobs:
  checks:
    # A private repo pays for hosted minutes, so the job runs on the Windows PC.
    runs-on: [self-hosted, local]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          # The tools stay on the PC between runs.
          cache: false
      - run: mise x -- npm ci
      - run: mise run check
      - run: mise x -- npm run package
