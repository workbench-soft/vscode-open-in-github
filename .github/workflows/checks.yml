name: Checks

# Runs lint, the type check, the unit tests and the production build on each
# push to main. Release runs once they pass.
on:
  push:
    branches: [main]
  # PR runs are off: agents run `mise run check` locally before they merge.
  # To run this on PRs again, uncomment the line below.
  # pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    # The repo is public, so GitHub runners cost 0. A self-hosted runner would run code from any fork.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          cache: true
      - run: mise x -- npm ci
      - run: mise run check
      - run: mise x -- npm run package
