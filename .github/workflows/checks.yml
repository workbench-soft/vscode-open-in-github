name: Checks

# Runs lint, the type check, the unit tests and the production build on each
# push to main and each PR.
on:
  push:
    branches: [main]
  # The repo is public, so PRs from outside get checked too.
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    # The repo is public, so GitHub runners cost nothing and fork PRs stay off
    # the Windows PC.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      - run: mise x -- npm ci
      - run: mise run check
      - run: mise x -- npm run package
