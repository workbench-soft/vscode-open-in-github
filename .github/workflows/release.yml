name: Release

# Release starts once Checks pass on main, so no job holds a runner while it waits.
on:
  workflow_run:
    workflows: [Checks]
    types: [completed]
  # A run by hand ships main again, once its Checks passed. The local-ci page starts it this way.
  workflow_dispatch:

# One release at a time. A newer run waiting here replaces an older waiting one, and ships its commits too.
concurrency:
  group: release

permissions:
  actions: read
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  release:
    # Only Checks that passed on a push to main of this repo, or a run by hand on main, start it.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      contains(fromJSON('["push","workflow_dispatch"]'), github.event.workflow_run.event))
    # The repo is public, so GitHub runners cost 0.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          # The release notes and the next version need every earlier tag and commit.
          fetch-depth: 0

      # A run by hand looks up Checks of the commit once and stops unless they passed. It doesn't wait.
      - name: Check that Checks passed on this commit
        if: github.event_name == 'workflow_dispatch'
        env:
          CHECKS_WORKFLOW: checks.yml
        run: |
          result=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$CHECKS_WORKFLOW/runs?head_sha=$SHA&branch=main&per_page=1" --jq '.workflow_runs[0].conclusion // "missing"')
          if [ "$result" != success ]; then
            echo "::error::Checks of $SHA: $result. Run Checks on main, and this follows once they pass."
            exit 1
          fi

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          cache: true

      - name: Pick the next version
        id: version
        run: echo "tag=v$(.github/scripts/next-version.sh)" >> "$GITHUB_OUTPUT"

      # vsce takes semver only, and 2026.10.30.1 has 4 parts. The extension gets 2026.1030.1,
      # with the leading zero of the month dropped, since semver forbids it: 5 January is 2026.105.1.
      # The version is set for this build only and stays out of git.
      - name: Package the extension into dist/
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          IFS=. read -r year month day n <<< "${TAG#v}"
          mise x -- npm ci
          mise x -- npm pkg set "version=$year.$((10#$month$day)).$n"
          mise run build

      # gh release create makes the tag with the release, so a cancel leaves no tag without a release.
      - name: Tag the commit and publish the release
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          .github/scripts/release-notes.sh "$TAG" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" dist/*.vsix --target "$SHA" --notes-file "$RUNNER_TEMP/notes.md" --title "$TAG"
