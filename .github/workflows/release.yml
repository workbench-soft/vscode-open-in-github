name: Release

# Release builds beside Checks, publishes once they pass on the commit, and stops when they fail.
# No job waits on a runner for the other workflow. release-gate.sh ties them together.
on:
  push:
    branches: [main]
  # The local-ci page starts it this way. A run by hand publishes once Checks of the commit passed.
  workflow_dispatch:
  # Checks ending publishes the build, or cancels it when they failed.
  workflow_run:
    workflows: [Checks]
    types: [completed]

permissions:
  # release-gate.sh reads the runs of the commit, and cancels a build.
  actions: write
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  CHECKS_WORKFLOW: checks.yml
  RELEASE_WORKFLOW: release.yml
  # The files the build hands to publish, as cache paths.
  RELEASE_FILES: |
    release-tag
    dist/

jobs:
  build:
    # Builds beside Checks. A run by hand from another branch would build a commit no check passed.
    if: github.event_name != 'workflow_run' && github.ref == 'refs/heads/main'
    # The repo is public, so GitHub runners cost 0.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          # The release notes and the next version need every earlier tag and commit.
          fetch-depth: 0

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          cache: true

      - name: Pick the next version
        id: version
        run: echo "tag=v$(.github/scripts/next-version.sh)" >> "$GITHUB_OUTPUT"

      # vsce takes semver only, and 2026.10.30.1 has 4 parts. The extension gets 2026.1030.1,
      # with the leading zero of the month dropped, since semver forbids it: 5 January is 2026.105.1.
      # The version is set for this build only and stays out of git.
      - name: Package the extension into dist/
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          IFS=. read -r year month day n <<< "${TAG#v}"
          mise x -- npm ci
          mise x -- npm pkg set "version=$year.$((10#$month$day)).$n"
          mise run build
      - name: Keep the tag with the files
        run: echo "${{ steps.version.outputs.tag }}" > release-tag
      # The publish job may run on another runner, so the files and the tag travel through the cache.
      # The artifact storage of the org is full, and the cache of each repo holds 10 GB.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: release-${{ github.run_id }}
          path: ${{ env.RELEASE_FILES }}
          enableCrossOsArchive: true
      # The last step, so a Checks run that ends after it starts publish through workflow_run.
      - name: Look up Checks of this commit once
        id: checks
        run: sh .github/scripts/release-gate.sh checks
    outputs:
      checks: ${{ steps.checks.outputs.checks }}

  publish:
    # Right after the build when Checks already passed, else once Checks pass on a push to main of this repo.
    needs: build
    if: >-
      !cancelled() && (needs.build.outputs.checks == 'success' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && contains(fromJSON('["push","workflow_dispatch"]'), github.event.workflow_run.event)))
    # One publish at a time, so each sees the tag of the one before. A newer waiting one replaces an older waiting one.
    concurrency:
      group: release-publish
    # The repo is public, so a GitHub runner costs 0 and fork code stays off the PC.
    runs-on: ubuntu-latest
    steps:
      # The release notes need every earlier tag and commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
      - name: Find the build of this commit
        id: gate
        run: |
          if [ "${{ github.event_name }}" != workflow_run ]; then
            echo "run=${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          else
            sh .github/scripts/release-gate.sh build
          fi
      - if: steps.gate.outputs.run
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: release-${{ steps.gate.outputs.run }}
          path: ${{ env.RELEASE_FILES }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      # The steps below read the tag the build picked, as steps.version.outputs.tag.
      - name: Read the tag the build picked
        if: steps.gate.outputs.run
        id: version
        run: |
          git fetch --quiet --force --tags origin
          if [ -n "$(git tag --points-at "$SHA")" ]; then
            echo "$SHA has a release already: $(git tag --points-at "$SHA" | tr '\n' ' ')"
          else
            echo "tag=$(cat release-tag)" >> "$GITHUB_OUTPUT"
          fi

      # gh release create makes the tag with the release, so a cancel leaves no tag without a release.
      - name: Tag the commit and publish the release
        if: steps.version.outputs.tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          .github/scripts/release-notes.sh "$TAG" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" dist/*.vsix --target "$SHA" --notes-file "$RUNNER_TEMP/notes.md" --title "$TAG"

  cancel:
    # A failed Checks run stops the build of the same commit.
    if: >-
      github.event_name == 'workflow_run' && contains(fromJSON('["failure","timed_out"]'), github.event.workflow_run.conclusion) && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository
    # The repo is public, so a GitHub runner costs 0 and fork code stays off the PC.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          sparse-checkout: .github/scripts
      - run: sh .github/scripts/release-gate.sh cancel
