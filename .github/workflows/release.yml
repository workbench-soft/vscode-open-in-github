name: Release

# Each push to main whose Checks pass gets a release. The tag is the date: v2026.10.30.1, then v2026.10.30.2.
# A merge while another session still has a PR open skips the release. The last merge ships them all.
on:
  workflow_run:
    workflows: [Checks]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  # A workflow_run starts on the latest main, which can be newer than the commit Checks tested.
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  # Holds the release while an agent session still has a PR open. Dependabot and PRs idle for 6 hours don't hold it.
  gate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      go: ${{ steps.open.outputs.go }}
    steps:
      - id: open
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open=$(gh pr list -R "$GITHUB_REPOSITORY" --state open --json number,author,updatedAt --jq '[.[] | select((.author.is_bot | not) and (.updatedAt | fromdateiso8601) > now - 21600) | "#" + (.number | tostring)] | join(" ")')
          if [ -n "$open" ] && [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
            echo "::notice::Release waits for the open PRs $open"
            echo go=false >> "$GITHUB_OUTPUT"
          else
            echo go=true >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    # One release runs at a time, so each sees the tag of the one before. A newer one cancels the stale one.
    concurrency:
      group: release
      cancel-in-progress: true
    # The repo is public, so GitHub runners cost 0.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          # The release notes and the next version need every earlier tag and commit.
          fetch-depth: 0
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          cache: true

      - name: Pick the next version
        id: version
        run: echo "tag=v$(.github/scripts/next-version.sh)" >> "$GITHUB_OUTPUT"

      # vsce takes semver only, and 2026.10.30.1 has 4 parts. The extension gets 2026.1030.1,
      # with the leading zero of the month dropped, since semver forbids it: 5 January is 2026.105.1.
      # The version is set for this build only and stays out of git.
      - name: Package the extension into dist/
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          IFS=. read -r year month day n <<< "${TAG#v}"
          mise x -- npm ci
          mise x -- npm pkg set "version=$year.$((10#$month$day)).$n"
          mise run build

      # A tag pushed with the workflow token doesn't start other workflows.
      - name: Tag the commit and publish the release
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          .github/scripts/release-notes.sh "$TAG" > "$RUNNER_TEMP/notes.md"
          git tag "$TAG" "$SHA"
          git push origin "$TAG"
          gh release create "$TAG" dist/*.vsix --verify-tag --notes-file "$RUNNER_TEMP/notes.md" --title "$TAG"
