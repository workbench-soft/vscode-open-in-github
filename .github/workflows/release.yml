name: Release

# Each push to main gets a release with the .vsix once its Checks pass. The release builds beside Checks, and only publication waits.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  # wait-for-checks.sh reads the checks runs of the commit.
  actions: read
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  SHA: ${{ github.sha }}

jobs:
  release:
    # A run by hand from another branch would tag a commit no check passed, so it releases main only.
    if: github.ref == 'refs/heads/main'
    # The repo is public, so GitHub runners cost 0.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          # The release notes and the next version need every earlier tag and commit.
          fetch-depth: 0
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          cache: true

      - name: Pick the next version
        id: version
        run: echo "tag=v$(.github/scripts/next-version.sh)" >> "$GITHUB_OUTPUT"

      # vsce takes semver only, and 2026.10.30.1 has 4 parts. The extension gets 2026.1030.1,
      # with the leading zero of the month dropped, since semver forbids it: 5 January is 2026.105.1.
      # The version is set for this build only and stays out of git.
      - name: Package the extension into dist/
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          IFS=. read -r year month day n <<< "${TAG#v}"
          mise x -- npm ci
          mise x -- npm pkg set "version=$year.$((10#$month$day)).$n"
          mise run build

      - name: Wait for the checks run of this commit
        env:
          CHECKS_WORKFLOW: checks.yml
        run: sh .github/scripts/wait-for-checks.sh

      # gh release create makes the tag with the release, so a cancel leaves no tag without a release.
      - name: Tag the commit and publish the release
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          .github/scripts/release-notes.sh "$TAG" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" dist/*.vsix --target "$SHA" --notes-file "$RUNNER_TEMP/notes.md" --title "$TAG"
